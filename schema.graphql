"""A persistent cloud agent for running coding harnesses."""
type CloudAgent {
  """
  WebSocket endpoint of the in-VM harness gate, for the dashboard chat. Survives
  sleep: the domain is stable across sleep and wake. Prefers the machine
  observation; when that carries no gate domain it falls back to the domain
  network-cp actively serves, so an agent whose observation lagged still offers
  chat. Null on agents created before the gate existed, or asleep/absent machines.
  """
  agentWsUrl: String

  """Target ID for console or command execution. Null while unavailable."""
  consoleTargetId: String
  createdAt: DateTime!

  """
  The agent machine's public HTTP domain (port 8080) — the live preview. Prefers
  the observation (falling back to the first declared domain when 8080 was never
  requested); when the observation carries no domains it falls back to the
  domain network-cp actively serves on 8080, so a preview shows even when the
  observation lagged. Returns null while the machine sleeps.
  """
  domain: String

  """
  Every public domain on the agent's machine, one per port, in the order the machine declared them.
  """
  domains: [CloudAgentDomain!]!
  environmentId: String!
  id: ID!
  name: String!
  project: Project!
  projectId: String!

  """
  Region the agent's machine runs in. Null briefly after creation, before the machine has been placed.
  """
  region: String

  """
  Live coding-agent sessions, one entry per session. Retained for 24h after the
  last report, so a sleeping agent still shows what it was last doing.
  """
  sessions: [CloudAgentSnapshot!]!

  """
  Repo this agent's workspace was created from. Null for agents created without a source.
  """
  source: CloudAgentSource
  status: CloudAgentStatus!
}

