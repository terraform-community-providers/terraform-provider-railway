  ): [Log!]!

  """Subscribe to updates for a specific deployment"""
  deployment(id: String!): Deployment!

  """Subscribe to deployment events for a specific deployment"""
  deploymentEvents(id: String!): DeploymentEvent!

  """Subscribe to deployment instance executions for a specific deployment"""
  deploymentInstanceExecutions(input: DeploymentInstanceExecutionInput!): DeploymentInstanceExecution!

  """Stream logs for a deployment"""
  deploymentLogs(
    deploymentId: String!

    """Filter logs by a string. Providing an empty value will match all logs."""
    filter: String

    """Limit the number of logs returned (defaults 100, max 5000)"""
    limit: Int
  ): [Log!]!

  """Stream individual DNS query logs for an environment"""
  dnsQueryLogs(
    """Latest date to look for logs after the anchor"""
    afterDate: String

    """Limit logs returned after the anchor"""
    afterLimit: Int

    """Target date time to look for logs"""
    anchorDate: String

    """Oldest date to look for logs before the anchor"""
    beforeDate: String

    """Limit logs returned before the anchor"""
    beforeLimit: Int

    """Filter by deployment instance / sandbox ID (optional)"""
    deploymentInstanceId: String
    environmentId: String!

    """
    Filter expression (e.g., @rcode:NXDOMAIN @qtype:A @domain:example.com
    @status:failed). Prefix a term with - to exclude it; repeat a key to match
    any of its values
    """
    filter: String

    """Filter by service ID (optional)"""
    serviceId: String
  ): [DnsQueryLog!]!

  """Stream logs for a project environment"""
  environmentLogs(
    """Latest date to look for logs after the anchor"""
    afterDate: String

    """Limit the number of logs returned after the anchor"""
    afterLimit: Int

    """Target date time to look for logs"""
    anchorDate: String

    """Oldest date to look for logs before the anchor"""
    beforeDate: String

    """Limit the number of logs returned before the anchor"""
    beforeLimit: Int
    environmentId: String!

    """Filter logs using a query syntax"""
    filter: String
  ): [Log!]!

  """Subscribe to updates for the staged patch for a single environment."""
  environmentStagedPatch(environmentId: String!): EnvironmentPatch!

  """Stream HTTP logs for a deployment"""
  httpLogs(
    """Latest date to look for logs after the anchor"""
    afterDate: String

    """Limit the number of logs returned after the anchor"""
    afterLimit: Int

    """Target date time to look for logs"""
    anchorDate: String

    """Oldest date to look for logs before the anchor"""
    beforeDate: String

    """Limit the number of logs returned before the anchor"""
    beforeLimit: Int
    deploymentId: String!

    """Filter logs using a query syntax"""
    filter: String
  ): [HttpLog!]!

  """Stream network flow logs for an environment"""
  networkFlowLogs(
    """Latest date to look for logs after the anchor"""
    afterDate: String

    """Limit logs returned after the anchor"""
    afterLimit: Int

    """Target date time to look for logs"""
    anchorDate: String

    """Oldest date to look for logs before the anchor"""
    beforeDate: String

    """Limit logs returned before the anchor"""
    beforeLimit: Int

    """Filter by deployment instance / sandbox ID (optional)"""
    deploymentInstanceId: String
    environmentId: String!

    """
    Filter expression (e.g., @protocol:tcp @direction:egress @dropped:true)
    """
    filter: String

    """Filter by service ID (optional)"""
    serviceId: String
  ): [NetworkFlowLog!]!

  """
  Subscribe to notification delivery updates (created and resolved) for the authenticated user
  """
