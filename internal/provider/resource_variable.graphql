query getVariables(
  $projectId: String!
  $environmentId: String!
  $serviceId: String!
) {
  variables(
    environmentId: $environmentId
    projectId: $projectId
    serviceId: $serviceId
    unrendered: true
  )
}

# @genqlient(for: "VariableUpsertInput.serviceId", pointer: true)
mutation upsertVariable(
  $input: VariableUpsertInput!
) {
  variableUpsert(input: $input)
}

# @genqlient(for: "VariableDeleteInput.serviceId", pointer: true)
mutation deleteVariable(
  $input: VariableDeleteInput!
) {
  variableDelete(input: $input)
}

mutation redeployServiceInstance(
    $environmentId: String!,
    $serviceId: String!
) {
    serviceInstanceRedeploy(environmentId: $environmentId, serviceId: $serviceId)
}

query getEnvironmentVariables(
  $environmentId: String!
  # @genqlient(pointer: true)
  $after: String
) {
  environment(id: $environmentId) {
    variables(first: 100, after: $after) {
      edges {
        node {
          name
          serviceId
          isSealed
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
